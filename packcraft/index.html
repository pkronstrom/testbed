    add.title = storedIdx == null
      ? 'addSeam splits a segment between two STORED welds; a bridge span runs '
        + 'from a weld to its own mirror, so there is nothing to insert between'
      : 'insert a weld into the segment aft of W' + state.doc.welds[storedIdx].id
        + ', interpolated along the loft';
    document.getElementById('btn-del').disabled = !w || state.doc.welds.length <= 2;
    document.getElementById('btn-undo').disabled = !state.undo.length;
    document.getElementById('lock').checked = !!state.doc.locks.uniformB;

    document.getElementById('weldline').textContent = w
      ? ('W' + w.id + '  ·  ' + (w.onCentreplane ? 'on the centreplane (pointed tip)'
          : 'off the mirror line') + (state.doc.locks.uniformB
          ? '  ·  b is locked boat-wide' : ''))
      : 'none — click a dot';
    FIELDS.forEach(function (f) {
      var inp = fieldInputs[f.key];
      inp.disabled = !w;
      inp.value = w ? fmtN(f.get(w), f.dp) : '';
    });

    if (state.built) { set3d(state.built); setFlat(state.built); }
    drawPane(PANES.top);
    drawPane(PANES.side);
    drawSection();
  }

  // ==================================================================
  // The driver
  // ==================================================================
  /**
   * Rebuild everything from the document.
   *
   * `preview` runs the coarse sampling and SKIPS the gates: a pointer move is
   * not the moment to integrate conservation over 96 Gauss panels per segment.
   * The report is dimmed while it is stale so nobody reads a number that
   * belongs to the shape from two frames ago.
   *
   * A build that THROWS does not take the editor with it. An edit is allowed to
   * make a hopeless boat (that is the policy), and a hopeless boat is exactly
   * where the numerics are entitled to give up; the last good build stays on
   * screen and the failure is reported in the status line.
   */
  function regenerate(opts) {
    var o = opts || {};
    var t0 = performance.now();
    var built;
    try {
      built = DV.build(state.doc, o.preview ? PREVIEW : BUILD);
      state.error = null;
    } catch (err) {
      state.error = err && err.message ? err.message : String(err);
      built = null;
    }
    var tBuild = performance.now() - t0;
    if (built) state.built = built;
    // A preview build is a different (coarser) boat, so the observers' answers
    // would be about geometry nobody has agreed to yet. Drop them rather than
    // show a waterline for last frame's hull.
    if (o.preview) { state.analysis = null; state.suggestion = null; }
    var footer = document.getElementById('footer');
    if (!o.preview && state.built && !state.error) {
      var t1 = performance.now();
      state.rep = CK.report(state.built);
      runAnalysis();
      setReport(state.built, state.rep);
      footer.className = '';
      document.getElementById('stats').textContent =
        'volume ' + (state.built.volume / 1e6).toFixed(1) + ' L · floor perimeter '
        + state.built.floor.perimeter3D.toFixed(0) + ' mm · ease '
        + state.built.floor.totalEase.toFixed(1) + ' mm · build ' + tBuild.toFixed(0)
        + ' ms + checks ' + (performance.now() - t1).toFixed(0) + ' ms';
    } else {
      footer.className = 'stale';
      drawFlotation();
      document.getElementById('stats').textContent = state.error
        ? ('BUILD FAILED: ' + state.error + ' — the document is still valid and undoable')
        : ('preview · build ' + tBuild.toFixed(0) + ' ms · gates re-run on release');
    }
    document.getElementById('title').textContent =
      state.doc.meta.name + ' — ' + state.doc.welds.length + ' stored welds'
      + (state.built ? (' (' + state.built.ring.welds.length + ' derived), '
        + state.built.panels.length + ' panels') : '');
    syncSelection();
    resize3d();
  }

  // ==================================================================
  // THE ANALYSIS STRIP -- B6's deliverable. Reads; never writes.
  // ==================================================================

  var flotEl = document.getElementById('flot');
  var loadField = document.getElementById('load');
  var pressField = document.getElementById('press');

  /**
   * One observer pass over the current FULL build.
   *
   * Called from `regenerate` beside the gates, and from the load/pressure
   * fields on their own (the geometry has not changed, only a number about the
   * water). It never touches `state.doc`, and engine/analysis.js is written so
   * that it could not: every function there takes the document and returns a
   * plain readout.
   */
  function runAnalysis() {
    if (!state.built || state.error) { state.analysis = null; return; }
    var t0 = performance.now();
    try {
      state.analysis = AN.observe(state.built, {
        loadKg: state.loadKg, pressurePa: state.pressurePa,
      });
      state.analysis.ms = performance.now() - t0;
    } catch (err) {
      state.analysis = null;
      flotEl.textContent = 'analysis failed: ' + (err && err.message);
      return;
    }
    drawFlotation();
  }

  function drawFlotation() {
    var a = state.analysis;
    if (!a) { flotEl.textContent = '—'; return; }
    var f = a.flotation, h = a.hoop;
    if (!f.floats) {
      flotEl.innerHTML = '<span class="warnish">SWAMPS at ' + f.loadKg.toFixed(0)
        + ' kg — this hull carries <b>' + f.swampLoadKg.toFixed(0)
        + ' kg</b> with the sheer dry</span>';
      return;
    }
    var pct = (100 * f.immersed.bathtubShare).toFixed(0);
    flotEl.innerHTML =
      'waterline <b>' + f.waterline.toFixed(1) + '</b> mm · freeboard <b>'
      + f.freeboard.toFixed(0) + '</b> mm (' + f.freeboardMid.toFixed(0)
      + ' over the floor) · displaced <b>' + (f.immersed.total / 1e6).toFixed(1)
      + '</b> L = tube ' + (f.immersed.tube / 1e6).toFixed(1) + ' + floor '
      + (f.immersed.bathtub / 1e6).toFixed(1) + ' (' + pct
      + '%) · reserve <b>' + f.reserveRatio.toFixed(2) + '</b> · wetted '
      + (f.wettedArea / 1e6).toFixed(2) + ' m² · hoop ≤ <b>'
      + h.worst.tensionHeld.toFixed(2) + '</b> N/mm ('
      + (100 * h.worst.utilisation).toFixed(0) + '% of fabric) · swamps at '
      + f.swampLoadKg.toFixed(0) + ' kg';
  }

  loadField.addEventListener('input', function () {
    state.loadKg = Math.max(1, +loadField.value || 1);
    runAnalysis(); syncSelection();
  });
  pressField.addEventListener('input', function () {
    state.pressurePa = Math.max(1, (+pressField.value || 0.15) * 6894.76);
    runAnalysis(); setReport(state.built, state.rep);
  });
  document.getElementById('wl-show').addEventListener('change', function (e) {
    state.showWaterline = e.target.checked;
    syncSelection();
  });

  // ---------------------------------------------------------------- suggest
  /**
   * suggest seams: PREVIEW, then confirm.
   *
   * The proposal is data (engine/analysis.js returns op descriptors and never
   * edits anything), so the button draws it as ghost dots and stops. Pressing
   * apply replays the descriptors through `ops.apply` ONE AT A TIME, pushing
   * each inverse -- so the undo stack is made of the same entries a hand edit
   * would have left, and stepping back through them unwinds the suggestion.
   */
  var suggestBtn = document.getElementById('btn-suggest');
  var applyBtn = document.getElementById('btn-suggest-ok');
  var cancelBtn = document.getElementById('btn-suggest-no');

  function setSuggestion(p) {
    state.suggestion = p;
    applyBtn.disabled = !p || !p.steps.length;
    cancelBtn.disabled = !p;
    if (state.built && state.rep) setReport(state.built, state.rep);
    drawPane(PANES.top); drawPane(PANES.side);
  }

  suggestBtn.addEventListener('click', function () {
    var cap = Math.max(5, +document.getElementById('cap').value || 55);
    var want = Math.max(0, Math.round(+document.getElementById('tgt').value || 0));
    var p;
    try {
      p = AN.suggestSeams(state.doc, { maxTurnDeg: cap, welds: want || null });
    } catch (err) {
      note('suggest failed: ' + err.message, true);
      return;
    }
    setSuggestion(p);
    note(p.steps.length
      ? ('preview: ' + state.doc.welds.length + ' welds → ' + p.stations.length
        + ' (' + p.inserted + ' inserted, ' + p.moved + ' moved), worst turn '
        + p.worstTurnBeforeDeg.toFixed(0) + '° → ' + p.worstTurnDeg.toFixed(0)
        + '° — apply or cancel')
      : 'nothing to suggest: every turn is inside the cap, or the corners that '
        + 'are not have no room to be split (see the table)');
  });

  applyBtn.addEventListener('click', function () {
    var p = state.suggestion;
    if (!p || !p.steps.length) return;
    var n = 0;
    for (var i = 0; i < p.steps.length; i++) {
      var r = OPS.apply(state.doc, p.steps[i]);
      state.undo.push(r.inverse);
      state.doc = r.doc;
      n++;
    }
    setSuggestion(null);
    if (D.byId(state.doc, state.weld) < 0) state.weld = null;
    state.segment = null;
    regenerate();
    note('applied ' + n + ' ops — undo steps back through them one at a time');
  });

  cancelBtn.addEventListener('click', function () {
    setSuggestion(null);
    note('');
  });

  /**
   * Run one op. THIS IS THE WHOLE EDIT LOOP: a document goes in, a document
   * comes out, the inverse goes on the undo stack, and everything on screen is
   * recomputed from the new document. Nothing is mutated in place and no view
   * holds state the document does not.
   */
  function run(r) {
    if (!r) return;
    // A PROPOSAL BELONGS TO THE DOCUMENT IT WAS COMPUTED FROM. Its steps carry
    // the ids the inserted welds will take, and those are only right for that
    // document -- so any other edit retires the preview rather than leaving a
    // stale one that would apply somewhere else entirely.
    if (state.suggestion) setSuggestion(null);
    if (r.detail && r.detail.topology && /->/.test(r.detail.topology)) {
      state.topology = r.detail.topology.replace('->', ' \u2192 ');
    }
    state.undo.push(r.inverse);
    state.doc = r.doc;
    if (r.detail && r.detail.newId != null) state.weld = r.detail.newId;
    if (r.removedSegments.indexOf(state.segment) >= 0) state.segment = null;
    regenerate();
    if (window.console) {
      console.log(r.op, r.args, 'changed', r.changedSegments,
        'removed', r.removedSegments, r.detail);
    }
  }

  document.getElementById('btn-add').addEventListener('click', function () {
    var i = storedSegmentIndex();
    if (i != null) run(OPS.addSeam(state.doc, i, 0.5));
  });
  document.getElementById('btn-del').addEventListener('click', function () {
    if (state.weld != null && state.doc.welds.length > 2) {
      var gone = state.weld;
      state.weld = null;
      run(OPS.removeSeam(state.doc, gone));
    }
  });
  document.getElementById('lock').addEventListener('change', function (e) {
    run(OPS.setLock(state.doc, 'uniformB', e.target.checked));
  });
  document.getElementById('soft').addEventListener('input', function (e) {
    // A UI setting, not a document field: it shapes what the NEXT drag writes.
    state.softRadius = Math.max(0, +e.target.value || 0);
    drawPane(PANES.top); drawPane(PANES.side);
  });
  document.getElementById('btn-undo').addEventListener('click', function () {
    var inv = state.undo.pop();
    if (!inv) return;
    if (state.suggestion) setSuggestion(null);
    var r = OPS.apply(state.doc, inv);
    state.doc = r.doc;                       // do NOT push this one's inverse
    if (D.byId(state.doc, state.weld) < 0) state.weld = null;
    regenerate();
  });
  document.getElementById('btn-fit').addEventListener('click', function () {
    PANES.top.fitted = false; PANES.side.fitted = false;
    drawPane(PANES.top); drawPane(PANES.side);
  });

  var picker = document.getElementById('tpl');
  T.names().forEach(function (n) {
    var o = document.createElement('option');
    o.value = n;
    o.textContent = T.LIBRARY[n]().meta.name;
    picker.appendChild(o);
  });
  /** Everything a new boat resets, whatever it came from. */
  function adopt(doc) {
    state.doc = D.create(doc);
    state.segment = null; state.weld = null; state.undo = []; state.topology = null;
    state.suggestion = null; state.analysis = null;
    // A new boat is a new fit; a pan or a zoom of the SAME boat is not
    // (v3 amendment: "fix view2d fit() reset" -- the view must not jump back
    // every time the geometry is rebuilt).
    PANES.top.fitted = false; PANES.side.fitted = false;
    regenerate();
  }
  function load(name) {
    if (name === LINK_VALUE) { adopt(D.clone(linkedDoc)); return; }
    if (picker.value !== name) picker.value = name;   // keep `reset` honest when
                                                      // a script drove the load
    adopt(T.template(name));
  }

  /**
   * A document that arrived down a permalink. It is not in the library, so it
   * gets its own entry in the picker -- and `reset` has to mean "back to the
   * boat in the link", not "back to whatever template happens to be selected".
   */
  var LINK_VALUE = '__link';
  var linkedDoc = null;
  function loadLinked(doc) {
    linkedDoc = D.clone(doc);
    if (!picker.querySelector('option[value="' + LINK_VALUE + '"]')) {
      var o = document.createElement('option');
      o.value = LINK_VALUE;
      picker.insertBefore(o, picker.firstChild);
    }
    picker.querySelector('option[value="' + LINK_VALUE + '"]').textContent =
      'shared link — ' + doc.meta.name;
    picker.value = LINK_VALUE;
    adopt(doc);
  }
  picker.addEventListener('change', function (e) { load(e.target.value); });
  document.getElementById('btn-reset').addEventListener('click', function () {
    load(picker.value);
  });

  // ==================================================================
  // Blueprint export -- the UI stays THIN. Every decision (what to draw,
  // how to nest it, whether it may be exported at all) lives in
  // engine/export-svg.js and engine/tile.js; this is a button, a filename
  // and a Blob.
  // ==================================================================

  var noteEl = document.getElementById('exportNote');
  function note(text, bad) {
    noteEl.textContent = text || '';
    noteEl.style.color = bad ? '#e2705f' : '#6f7c8c';
  }
  /** The date the LIBRARY refuses to read. Clocks belong in the UI. */
  function today() { return new Date().toISOString().slice(0, 10); }
  function fileBase() {
    return (state.doc.meta.name || 'packraft').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'packraft';
  }
  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  /**
   * A FULL-resolution build for export, never the one on screen.
   *
   * A drag leaves `state.built` at PREVIEW sampling, which is right for a
   * pointer and wrong for a cutting pattern: the outline a builder traces must
   * not be a 16-ruling approximation of the one the gates passed. So export
   * rebuilds and re-checks from the document, every time. It costs ~0.5 s on an
   * explicit button press.
   */
  function buildForExport() {
    var built = DV.build(state.doc, BUILD);
    return { built: built, report: CK.report(built, { refine: false }) };
  }

  /**
   * Blueprint options. `mirrorOnce` defaults ON here and OFF in the library:
   * a DIY builder handed twice the paper they need has lost an afternoon, but
   * a library that quietly halves what it was asked to draw surprises whoever
   * calls it next. The full layout stays one click away.
   */
  var mirrorOnceBox = document.getElementById('mirror-once');
  var rollField = document.getElementById('roll');
  function exportOpts(rep) {
    return {
      now: today(),
      report: rep,
      mirrorOnce: mirrorOnceBox.checked,
      // Fabric comes on a roll and the width is what you can buy, not what you
      // would like. The packer treats it as the hard constraint.
      sheetWidth: Math.max(200, +rollField.value || XSVG.DEFAULTS.sheetWidth),
    };
  }

  document.getElementById('btn-svg').addEventListener('click', function () {
    note('building…');
    try {
      var b = buildForExport();
      var opts = exportOpts(b.report);
      var svg = XSVG.render(b.built, opts);
      download(new Blob([svg], { type: 'image/svg+xml' }),
        fileBase() + (opts.mirrorOnce ? '-mirror-once' : '') + '.svg');
      var d = XSVG.buildBody(b.built, opts);
      note('SVG: ' + d.parts.length + ' patterns for '
        + d.parts.reduce(function (s, p) { return s + p.qty; }, 0) + ' pieces, '
        + (d.layout.usedLength / 1000).toFixed(2) + ' m × ' + d.layout.sheetWidth
        + ' mm, ' + d.layout.wastePercent.toFixed(0) + '% waste');
    } catch (err) {
      note(err.message, true);
    }
  });

  var pageSel = document.getElementById('page');
  Object.keys(TILE.PAGE_SIZES).forEach(function (n) {
    var o = document.createElement('option');
    o.value = n;
    o.textContent = n + ' (' + TILE.PAGE_SIZES[n].join('×') + ' mm)';
    pageSel.appendChild(o);
  });
  pageSel.value = TILE.DEFAULTS.pageSize;

  document.getElementById('btn-print').addEventListener('click', function () {
    note('paginating…');
    try {
      var b = buildForExport();
      var opts = exportOpts(b.report);
      opts.pageSize = pageSel.value;
      var html = TILE.renderPrintHtml(b.built, opts);
      var blob = new Blob([html], { type: 'text/html' });
      // The same comparison the document itself ran: fabric layout vs
      // page-grid layouts, fewest sheets wins.
      var chosen = TILE.layoutFor(b.built, Object.assign({}, TILE.DEFAULTS, opts));
      var t = chosen.t;
      // A blob: URL opened from a file:// page is at the mercy of the popup
      // blocker and of the browser's file-origin rules, so the download is not
      // a fallback for failure -- it is the same artefact by another route.
      var w = window.open(URL.createObjectURL(blob), '_blank');
      if (!w) {
        download(blob, fileBase() + '-' + pageSel.value + '.html');
        note(t.sheets + ' ' + pageSel.value + ' sheets as ' + t.cols + ' × ' + t.rows
          + ' — popup blocked, downloaded instead');
      } else {
        note(t.sheets + ' ' + pageSel.value + ' sheets as ' + t.cols + ' × ' + t.rows
          + ' (' + t.skipped + ' blank omitted, ' + chosen.mode + ' layout)');
      }
    } catch (err) {
      note(err.message, true);
    }
  });

  document.getElementById('btn-link').addEventListener('click', function () {
    note('encoding…');
    ENC.encode(state.doc).then(function (payload) {
      var hash = ENC.hashFor(payload);
      try {
        history.replaceState(null, '', hash);
      } catch (err) {
        location.hash = hash;                 // file:// can refuse replaceState
      }
      return copyText(location.href).then(function (ok) {
        note((ok ? 'link copied — ' : 'link in the address bar — ')
          + payload.length + ' chars');
      });
    }).catch(function (err) {
      note('link failed: ' + err.message, true);
    });
  });

  /**
   * Clipboard, both ways round. `navigator.clipboard` needs a secure context
   * and a file:// page is not one, so the execCommand path is not legacy
   * cruft here -- it is the path that actually runs.
   */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; },
        function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (err) {
      return false;
    }
  }

  window.addEventListener('resize', function () {
    resize3d();
    drawPane(PANES.top);
    drawPane(PANES.side);
  });

  // Scripting/debug handle -- lets tests and tooling drive the editor, the
  // same convention as P.app in the main application.
  window.demo = {
    state: state, load: load, regenerate: regenerate, run: run,
    camera: camera, controls: controls, scene: scene,
    panes: PANES, ops: OPS, doc: D,
    /** Where a weld's dot is right now, in CLIENT pixels -- drive a real drag. */
    weldClient: function (paneName, id) {
      var pane = PANES[paneName];
      var i = D.byId(state.doc, id);
      return i < 0 ? null : clientAt(pane, state.doc.welds[i].c);
    },
    /** Where any world point lands, for handles and assertions. */
    clientAt: function (paneName, p) { return clientAt(PANES[paneName], p); },
    /** The client position of a named handle of the selected weld. */
    handleClient: function (paneName, kind, weldId) {
      var pane = PANES[paneName];
      var sel = '[data-handle="' + kind + '"]'
        + (weldId == null ? '' : '[data-weld="' + weldId + '"]');
      var el = pane.layers.handles.querySelector(sel);
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    },
    select: function (id) { state.weld = id; syncSelection(); },
    json: function () { return D.toJSON(state.doc); },
    /** The section inset, and the client position of one of its knot handles. */
    section: SECTION,
    sectionHandleClient: function (station) {
      var el = SECTION.svg.querySelector('[data-handle="profile"][data-station="'
        + station + '"]');
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    },
    /** Where a radial factor at a knot station lands, in CLIENT pixels. */
    sectionRadiusClient: function (station, factor) {
      var w = selectedWeld();
      var view = SECTION.view;
      if (!w || !view || !w.profile) return null;
      var prep = D.profilePrepare(w.profile);
      if (!prep) return null;
      var fr = D.weldFrame(w);
      var b2 = sectionUV(fr, D.weldBase(w, 2 * Math.PI * station / prep.m, fr));
      var r = SECTION.svg.getBoundingClientRect();
      return { x: r.left + view.cx + view.k * b2[0] * factor,
               y: r.top + view.cy - view.k * b2[1] * factor };
    },
    // The blueprint side, driveable headlessly: the same calls the buttons make.
    loadLinked: loadLinked,
    permalink: function () { return ENC.encode(state.doc); },
    exportSvg: function () {
      var b = buildForExport();
      return XSVG.render(b.built, exportOpts(b.report));
    },
    printHtml: function (pageSize) {
      var b = buildForExport();
      var o = exportOpts(b.report);
      o.pageSize = pageSize || pageSel.value;
      return TILE.renderPrintHtml(b.built, o);
    },
    mirrorOnce: function (on) {
      if (on != null) mirrorOnceBox.checked = !!on;
      return mirrorOnceBox.checked;
    },
    // The analysis strip, driveable headlessly: the same calls the fields and
    // the buttons make, so a screenshot test drives the real thing.
    analysis: function () { return state.analysis; },
    setLoad: function (kg) {
      loadField.value = kg;
      loadField.dispatchEvent(new Event('input'));
      return state.analysis;
    },
    setPressurePsi: function (psi) {
      pressField.value = psi;
      pressField.dispatchEvent(new Event('input'));
      return state.analysis;
    },
    suggest: function (opts) {
      if (opts && opts.maxTurnDeg != null) {
        document.getElementById('cap').value = opts.maxTurnDeg;
      }
      if (opts && opts.welds != null) document.getElementById('tgt').value = opts.welds;
      suggestBtn.click();
      return state.suggestion;
    },
    applySuggestion: function () { applyBtn.click(); },
    cancelSuggestion: function () { cancelBtn.click(); },
  };

  /**
   * `#d=<payload>` on the URL wins over the default template.
   *
   * Decoding is async (CompressionStream is a stream), so the default boat is
   * built first and the linked one replaces it a frame later. That ordering is
   * deliberate: a corrupt or truncated link leaves a working editor with a
   * message, rather than an empty page.
   */
  regenerate();
  (function openHash() {
    var payload = ENC.payloadFromHash(location.hash);
    if (!payload) return;
    note('opening link…');
    ENC.decode(payload).then(function (doc) {
      loadLinked(doc);
      note('opened from link — ' + doc.meta.name);
    }).catch(function (err) {
      note('link not readable: ' + err.message, true);
    });
  })();
})();
</script>

</body>
</html>
