# Publish the shelf.
#
# Runs on every push -- including the pushes that app repositories make into
# their own subdirectories -- so deploying an app is a single git push from
# somewhere else, with no edit here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # apps.json is DERIVED: generated into the artifact, never committed.
      # Committing it back would make every deploy push a commit that
      # triggers the next deploy, and would break re-runs -- a re-run checks
      # out the original commit, so its push is rejected as non-fast-forward.
      - name: Index the deployed apps
        run: node .github/scripts/index-apps.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
