<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testbed — pkronstrom</title>
<meta name="description" content="Single-file web apps, deployed from their own repositories.">
<style>
  /* One file, no dependencies, no build step -- the same rule the apps
     themselves are built under. Light and dark both, from the system. */
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --card: #ffffff;
    --ink: #16181d;
    --dim: #6b7280;
    --line: #e6e6e3;
    --accent: #2f6f4f;
    --shadow: 0 1px 2px rgba(16, 18, 24, .04), 0 8px 24px rgba(16, 18, 24, .05);
    --shadow-lift: 0 2px 4px rgba(16, 18, 24, .05), 0 16px 40px rgba(16, 18, 24, .09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #161920;
      --ink: #e7e9ee;
      --dim: #8d95a3;
      --line: #242832;
      --accent: #7fd0a3;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-lift: 0 2px 6px rgba(0, 0, 0, .5), 0 18px 44px rgba(0, 0, 0, .45);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  header { padding: 120px 0 64px; }
  @media (max-width: 640px) { header { padding: 72px 0 40px; } }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(34px, 6vw, 52px);
    letter-spacing: -.025em;
    font-weight: 620;
    line-height: 1.1;
  }
  .lede { margin: 0; max-width: 46ch; color: var(--dim); font-size: 17px; }
  .lede a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

  .rule {
    height: 1px; background: var(--line);
    margin: 0 0 40px;
  }
  .count {
    font: 500 12px/1 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
    padding-bottom: 14px; display: block;
  }

  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    padding-bottom: 96px;
  }

  .card {
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 24px 20px;
    text-decoration: none; color: inherit;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    outline: none;
  }
  .card h2 {
    margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -.01em;
  }
  .card p { margin: 0 0 18px; color: var(--dim); font-size: 15px; flex: 1; }
  .meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font: 500 12px/1 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    color: var(--dim);
  }
  .tag {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; white-space: nowrap;
  }
  .open { margin-left: auto; color: var(--accent); }

  .empty {
    border: 1px dashed var(--line); border-radius: 14px;
    padding: 56px 24px; text-align: center; color: var(--dim);
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 0 56px; color: var(--dim); font-size: 14px;
  }
  footer a { color: inherit; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Testbed</h1>
    <p class="lede">
      Single-file web apps — no frameworks, no build steps, no servers. Each one
      is built in its own repository and deployed here.
    </p>
  </header>

  <span class="count" id="count">loading…</span>
  <div class="rule"></div>
  <main class="grid" id="grid"></main>

  <footer>
    Deployed from GitHub Actions · <a href="https://github.com/pkronstrom/testbed">source</a>
  </footer>
</div>

<script>
// The grid is data-driven: every deploy regenerates apps.json by scanning the
// subdirectories, so adding an app is a push, never an edit to this file.
(async function () {
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  var apps = [];
  try {
    var res = await fetch('apps.json', { cache: 'no-cache' });
    if (res.ok) apps = await res.json();
  } catch (e) { /* file:// or offline -- fall through to the empty state */ }

  if (!apps.length) {
    count.textContent = 'nothing deployed yet';
    grid.innerHTML = '<div class="empty">No apps deployed yet. '
      + 'Push one into a subdirectory and it appears here.</div>';
    return;
  }

  count.textContent = apps.length + (apps.length === 1 ? ' app' : ' apps');
  for (var i = 0; i < apps.length; i++) {
    var a = apps[i];
    var card = document.createElement('a');
    card.className = 'card';
    card.href = a.path;

    var h = document.createElement('h2');
    h.textContent = a.name || a.path;
    card.appendChild(h);

    var p = document.createElement('p');
    p.textContent = a.description || '';
    card.appendChild(p);

    var meta = document.createElement('div');
    meta.className = 'meta';
    (a.tags || []).forEach(function (t) {
      var s = document.createElement('span');
      s.className = 'tag';
      s.textContent = t;
      meta.appendChild(s);
    });
    var open = document.createElement('span');
    open.className = 'open';
    open.textContent = 'open →';
    meta.appendChild(open);
    card.appendChild(meta);

    grid.appendChild(card);
  }
})();
</script>

</body>
</html>
